    <span class="stage-number">02</span><span><strong>Pré-Deflagração</strong><small>Disponível conforme cadastro</small></span>
  </button>
  <button type="button" [class.active]="etapaId === 30" [disabled]="!disponivel(30)" (click)="etapaSelecionada.emit(30)">

  </button>
</div>
