<!-- OBJETIVO DO TEMPLATE: Implementa a responsabilidade definida pelo arquivo operacoes-lista.component.html. -->
<!-- Comentários marcam blocos visuais; atributos autoexplicativos não são comentados individualmente. -->
<!-- Agrupamento semântico de conteúdo relacionado. -->
<section class="page-head">
  <h1>Cadastros de Operações</h1>
  <button class="primary-button" type="button" (click)="abrirCadastro()">Nova operação</button>
</section>

<!-- Agrupamento semântico de conteúdo relacionado. -->
<section class="panel">
  <app-grid-toolbar [busca]="busca()" [total]="total()" (buscaChange)="atualizarBusca($event)" />
  <app-operacoes-grid
    [operacoes]="operacoes()"
    [etapas]="etapas()"
    [visibilidades]="visibilidades()"
    [carregando]="carregando()"
    [carregandoMais]="carregandoMais()"
    [erro]="erro()"
    [ordenacao]="ordenacao()"
    [direcao]="direcao()"
    (ordenar)="ordenar($event)"
    (editar)="abrirEdicao($event)"
    (carregarMais)="carregarProximaPagina()" />
</section>

@if (modalAberto()) {
  <app-operacao-modal
    [form]="form"
    [operacao]="operacaoEmEdicao()"
    [visibilidades]="visibilidades()"
    [etapasDisponiveis]="etapasDisponiveis()"
    [erro]="erroCadastro()"
    [salvando]="salvando()"
    [removendo]="removendo()"
    (fechar)="fecharCadastro()"
    (salvar)="salvar()"
    (remover)="remover()"
    (etapaSelecionada)="selecionarEtapa($event)" />
}
