<div class="login-page">
  <section class="login-brand">
    <img class="seal" src="/brand/siga-crim-mark.svg" alt="SIGA Crim">
    <div>
      <strong>SIGA Crim</strong>
      <span>Sistema Integrado de Gestão e Análise Criminal</span>
    </div>
  </section>

  <section class="login-card" aria-labelledby="login-title">
    <header>
      <p>Acesso ao sistema</p>
      <h1 id="login-title">Entrar no SIGA Crim</h1>
      <span>Use suas credenciais institucionais.</span>
    </header>

    <form (ngSubmit)="entrar()">
      <label>
        <span>Usuário</span>
        <input name="usuario" [(ngModel)]="usuario" autocomplete="username" required autofocus>
      </label>
      <label>
        <span>Senha</span>
        <input name="senha" [(ngModel)]="senha" type="password" autocomplete="current-password" required>
      </label>

      <div class="error" *ngIf="erro()">{{ erro() }}</div>
      <button type="submit" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <footer>
      <span>Ambiente local</span>
      <small>Usuário inicial: admin</small>
    </footer>
  </section>
</div>
