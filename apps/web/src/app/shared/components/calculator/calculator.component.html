<!-- OBJETIVO DO TEMPLATE: Implementa a responsabilidade definida pelo arquivo calculator.component.html. -->
<!-- Comentários marcam blocos visuais; atributos autoexplicativos não são comentados individualmente. -->
<button class="calculator-trigger" type="button" (click)="openCalculator()" aria-label="Abrir calculadora" title="Calculadora">
  <app-lucide-icon name="calculator" />
</button>

@if (open()) {
  <div class="calculator-backdrop" (mousedown)="closeCalculator()">
    <!-- Agrupamento semântico de conteúdo relacionado. -->
    <section #dialog class="calculator-dialog" tabindex="-1" role="dialog" aria-modal="true" aria-label="Calculadora" (mousedown)="$event.stopPropagation()">
      <!-- Cabeçalho visual e ações principais desta área. -->
      <header class="calculator-header">
        <div>
          <strong>Calculadora</strong>
          <span>Use o teclado normalmente</span>
        </div>
        <button type="button" class="icon-button" (click)="closeCalculator()" aria-label="Fechar calculadora" title="Fechar">
          <app-lucide-icon name="x" />
        </button>
      </header>

      <div class="mode-switch" role="tablist" aria-label="Modo da calculadora">
        <button type="button" [class.active]="mode() === 'standard'" (click)="setMode('standard')">Comum</button>
        <button type="button" [class.active]="mode() === 'scientific'" (click)="setMode('scientific')">Científica</button>
      </div>

      <div class="calculator-display" aria-live="polite">
        <small>{{ expression() || '0' }}</small>
        <output>{{ display() }}</output>
      </div>

      <div class="memory-row">
        <button type="button" (click)="memoryClear()" [disabled]="!hasMemory()">MC</button>
        <button type="button" (click)="memoryRecall()" [disabled]="!hasMemory()">MR</button>
        <button type="button" (click)="memoryAdd()">M+</button>
        <button type="button" (click)="memorySubtract()">M−</button>
      </div>

      @if (mode() === 'scientific') {
        <div class="scientific-grid">
          <button type="button" (click)="functionInput('sin')">sin</button>
          <button type="button" (click)="functionInput('cos')">cos</button>
          <button type="button" (click)="functionInput('tan')">tan</button>
          <button type="button" (click)="functionInput('sqrt')">√</button>
          <button type="button" (click)="functionInput('log')">log</button>
          <button type="button" (click)="functionInput('ln')">ln</button>
          <button type="button" (click)="input('^')">xʸ</button>
          <button type="button" (click)="input('π')">π</button>
          <button type="button" (click)="input('e')">e</button>
          <button type="button" (click)="functionInput('abs')">|x|</button>
        </div>
      }

      <div class="keypad">
        <button type="button" class="utility" (click)="percent()">%</button>
        <button type="button" class="utility" (click)="clear()">C</button>
        <button type="button" class="utility" (click)="backspace()" aria-label="Apagar último caractere"><app-lucide-icon name="delete" /></button>
        <button type="button" class="operator" (click)="input('÷')">÷</button>

        <button type="button" (click)="input('7')">7</button><button type="button" (click)="input('8')">8</button><button type="button" (click)="input('9')">9</button><button type="button" class="operator" (click)="input('×')">×</button>
        <button type="button" (click)="input('4')">4</button><button type="button" (click)="input('5')">5</button><button type="button" (click)="input('6')">6</button><button type="button" class="operator" (click)="input('-')">−</button>
        <button type="button" (click)="input('1')">1</button><button type="button" (click)="input('2')">2</button><button type="button" (click)="input('3')">3</button><button type="button" class="operator" (click)="input('+')">+</button>
        <button type="button" (click)="toggleSign()">±</button><button type="button" (click)="input('0')">0</button><button type="button" (click)="input('.')">,</button><button type="button" class="equals" (click)="evaluate()">=</button>
      </div>
      <footer>Enter calcula · Enter novamente repete a última operação · Esc fecha</footer>
    </section>
  </div>
}
