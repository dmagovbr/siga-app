server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: siga-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sigacrim}
    username: ${DB_USER:sigacrim}
    password: ${DB_PASSWORD:sigacrim}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
