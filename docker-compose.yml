services:
  postgres:
    image: postgres:17-alpine
    container_name: sigacrim-postgres
    environment:
      POSTGRES_DB: sigacrim
      POSTGRES_USER: sigacrim
      POSTGRES_PASSWORD: sigacrim
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - sigacrim_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigacrim -d sigacrim"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sigacrim_postgres_data:
