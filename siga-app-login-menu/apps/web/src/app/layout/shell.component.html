<div class="app-shell" [class.menu-collapsed]="collapsed()">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-copy"><strong>SIGACrim</strong><span>Sistema de Gestão</span></div>
    </div>

    <nav aria-label="Menu principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="icon">⌂</span><span class="label">Início</span>
      </a>

      <div class="nav-group" [class.open]="openGroup() === 'operacoes'">
        <button type="button" (click)="toggleGroup('operacoes')"><span class="icon">▣</span><span class="label">Operações</span><span class="chevron">›</span></button>
        <div class="submenu">
          <a routerLink="/operacoes/lista" routerLinkActive="active"><span class="dot"></span><span class="label">Lista de Operações</span></a>
          <a routerLink="/operacoes/gestao" routerLinkActive="active"><span class="dot"></span><span class="label">Gestão</span></a>
        </div>
      </div>

      <div class="nav-group" [class.open]="openGroup() === 'eventos'">
        <button type="button" (click)="toggleGroup('eventos')"><span class="icon">◫</span><span class="label">Eventos</span><span class="chevron">›</span></button>
        <div class="submenu">
          <a routerLink="/eventos/lista" routerLinkActive="active"><span class="dot"></span><span class="label">Lista de Operações</span></a>
          <a routerLink="/eventos/gestao" routerLinkActive="active"><span class="dot"></span><span class="label">Gestão</span></a>
        </div>
      </div>

      <div class="nav-group" [class.open]="openGroup() === 'administracao'">
        <button type="button" (click)="toggleGroup('administracao')"><span class="icon">⚙</span><span class="label">Administração</span><span class="chevron">›</span></button>
        <div class="submenu">
          <a routerLink="/administracao/usuarios" routerLinkActive="active"><span class="dot"></span><span class="label">Usuários</span></a>
          <a routerLink="/administracao/perfis" routerLinkActive="active"><span class="dot"></span><span class="label">Perfis</span></a>
        </div>
      </div>
    </nav>

    <div class="sidebar-footer"><span class="status-dot"></span><span class="label">Ambiente local</span></div>
  </aside>

  <section class="workspace">
    <header class="topbar">
      <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Recolher ou expandir menu">☰</button>
      <div class="breadcrumb">SIGACrim <span>/</span> Área de trabalho</div>
      <div class="user"><span>{{ usuario()?.nome }}</span><div class="avatar">{{ initials() }}</div><button class="logout" type="button" (click)="logout()">Sair</button></div>
    </header>
    <main><ng-content /></main>
  </section>
</div>
